<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>muxtower — your coding agents, from your phone</title>
    <meta
      name="description"
      content="Approve, answer and steer Claude Code and Codex from your phone, in the terminals they already run in. Self-hosted, open source, no account."
    />
    <meta property="og:title" content="muxtower" />
    <meta
      property="og:description"
      content="Your coding agents, from your phone. Approve, answer and steer Claude Code and Codex where they already run."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The app's tokens switch on data-theme; follow the system's choice from the first paint.
      ;(function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)')
        var apply = function () {
          document.documentElement.dataset.theme = dark.matches ? 'dark' : 'light'
        }
        apply()
        dark.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
