# Deploys the web app to GitHub Pages. Off unless the repository variable DEPLOY_PAGES is "true"
# (Settings > Secrets and variables > Actions > Variables), and Pages is set to "GitHub Actions".
# Optional secret MUXTOWER_APP_CONFIG presets daemons (see README > Hosting the app).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          # Project pages live under /<repo>/; a custom domain can set vars.MUXTOWER_BASE to "/".
          MUXTOWER_BASE: ${{ vars.MUXTOWER_BASE || format('/{0}/', github.event.repository.name) }}
          MUXTOWER_APP_CONFIG: ${{ secrets.MUXTOWER_APP_CONFIG }}
      # GitHub Pages has no SPA fallback: serve the app for unknown paths too.
      - run: cp app/dist/index.html app/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
