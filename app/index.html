<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1114" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preload" href="/src/assets/fonts/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>muxtower</title>
    <script>
      // A page older than the server's files (one restored after a long time in the background, across
      // an update) asks for scripts that are gone and stays blank. Reload into the current version; if
      // that is still broken, once more without the service worker's cached copies. Twice a minute at most,
      // then say so instead of a blank page (an extension blocking a script fails the same way, every time).
      // The tries are counted in the real sessionStorage, taken now: the demo swaps the global one for its
      // own, wiped on every visit, which would count nothing and reload forever.
      ;(function () {
        var KEY = 'mxt-recover', reloading = false, store = null
        // Only our own files count: a third-party script failing (an analytics beacon an ad blocker
        // stops) is not a broken app.
        var OWN = new URL('%BASE_URL%', location.href).href
        try {
          store = window.sessionStorage
        } catch (e) {}
        function giveUp() {
          var root = document.getElementById('root')
          if (!root) return void addEventListener('DOMContentLoaded', giveUp)
          var box = document.createElement('div')
          box.setAttribute('role', 'alert')
          box.style.cssText = 'font:15px/1.5 system-ui,sans-serif;max-width:28rem;margin:20vh auto;padding:0 16px'
          box.textContent =
            "muxtower couldn't load. A browser extension may be blocking part of it; try a private window or turn extensions off for this site. "
          var link = document.createElement('a')
          link.href = location.href
          link.textContent = 'Reload'
          box.appendChild(link)
          root.replaceWith(box) // React may still hold #root; it keeps it, detached
        }
        function recover() {
          if (reloading) return // one page's several failures are one try
          reloading = true
          var tries = []
          try {
            tries = JSON.parse(store.getItem(KEY) || '[]').filter(function (t) {
              return Date.now() - t < 60000
            })
            if (tries.length >= 2) return giveUp()
            store.setItem(KEY, JSON.stringify(tries.concat(Date.now())))
          } catch (e) {
            return giveUp() // nowhere to count the tries: never reload blindly
          }
          var cleared =
            tries.length && window.caches
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                })
              : Promise.resolve()
          cleared.catch(function () {}).then(function () { location.reload() })
        }
        addEventListener('error', function (e) {
          var t = e.target
          var url = t && (t.tagName === 'SCRIPT' ? t.src : t.tagName === 'LINK' && /stylesheet|modulepreload/.test(t.rel) ? t.href : '')
          if (url && url.indexOf(OWN) === 0) recover()
        }, true)
        // A page's code, fetched when it is first opened (vite's lazy chunks).
        addEventListener('vite:preloadError', function (e) {
          e.preventDefault()
          recover()
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
