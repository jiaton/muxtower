<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The notification badge: Android draws only its alpha, in the status bar and the notification header.
       icon.svg's window and phone, filling the square; a gap, not a color, sets the phone apart. -->
  <mask id="gap">
    <rect width="64" height="64" fill="#fff"/>
    <rect x="29" y="20" width="35" height="44" rx="8" fill="#000"/>
  </mask>
  <mask id="phone">
    <rect width="64" height="64" fill="#fff"/>
    <path d="M42 36l6 5-6 5" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <g fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" mask="url(#gap)">
    <rect x="4" y="7" width="48" height="37" rx="6"/>
    <path d="M13 18l6 5.5-6 5.5"/>
  </g>
  <rect x="33" y="24" width="27" height="36" rx="5" fill="#fff" mask="url(#phone)"/>
</svg>
