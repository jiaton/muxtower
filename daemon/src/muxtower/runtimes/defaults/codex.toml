# Codex (the `codex` TUI). Sessions muxtower starts report through Codex's hooks (hooks/codex.py); these
# screen rules are the state source for adopted panes and the cross-check. They follow the dialogs of
# Codex's TUI (its own snapshot tests). Rules are tried in order, first match wins.
# Override by copying this file to ~/.config/muxtower/runtimes/codex.toml.
name = "codex"
binary = "codex"
hooks = "codex"
default_state = "idle"

[[rules]]
# Codex asks at startup to trust hooks it does not know yet; muxtower trusts its own, so this means a
# hook of the owner's or one Codex hashes differently. Approving continues without trusting them.
name = "hooks-review"
state = "needs_trust"
pattern = 'Hooks\s+need\s+review'

[[rules]]
name = "workspace-trust"
state = "needs_trust"
pattern = 'Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?'

[[rules]]
name = "command-approval"
state = "needs_permission"
pattern = 'Would\s+you\s+like\s+to\s+run\s+the\s+following\s+command\?'

[[rules]]
name = "edit-approval"
state = "needs_permission"
pattern = 'Would\s+you\s+like\s+to\s+make\s+the\s+following\s+edits\?'

[[rules]]
name = "network-approval"
state = "needs_permission"
pattern = 'Do\s+you\s+want\s+to\s+approve\s+network\s+access'

[[rules]]
name = "question"
state = "needs_answer"
pattern = 'Question\s+\d+/\d+.*\n(?s:.*)enter\s+to\s+submit\s+answer'

[[rules]]
name = "working"
state = "busy"
pattern = 'esc\s+to\s+interrupt'

[menu]
cursor = "›"

[approve]
default = ['^Yes\b']

[approve.prefer]
# Once: "don't ask again" writes a lasting rule for the command or files, which is the owner's call.
needs_permission = ['^Yes,\s*proceed\b', '^Yes\b']
needs_trust = ['^Yes\b', '^Continue\s+without\s+trusting']
needs_answer = []

[deny]
send = [{ key = "Escape" }]
