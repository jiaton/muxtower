# Claude Code. Hooks (http) are the primary state source; these screen rules are the fallback for
# sessions without hooks (adopted panes) and a cross-check. Rules are tried in order, first match wins.
# Override by copying this file to ~/.config/muxtower/runtimes/claude-code.toml.
name = "claude-code"
binary = "claude"
hooks = "claude-code"
default_state = "idle"
auto_approve_states = ["needs_permission", "needs_trust"]
resume = ["--resume"]
option_values = [
  "--model", "--fallback-model", "--permission-mode", "--settings", "--setting-sources", "--mcp-config",
  "--append-system-prompt", "--append-system-prompt-file", "--system-prompt", "--system-prompt-file",
  "--allowedTools", "--allowed-tools", "--disallowedTools", "--disallowed-tools", "--add-dir", "--agent",
  "--agents", "--remote-control", "--resume", "-r", "--session-id", "--plugin-dir", "--betas", "-n", "--name",
]
# Its input box between two rules (older versions: "> " over "? for shortcuts"). While it shows, a dialog
# can only be the panel framed right above it (a tip like "Teach auto mode…"), whatever the conversation
# above quotes.
prompt = '^─{8,}\n❯[^\n]*(?:\n[^─\n][^\n]*)*\n─{8,}|^>[^\n]*\n\s*\?\s+for\s+shortcuts'
panel_rule = '^─{8,}\s*$'

[[rules]]
name = "tool-permission"
state = "needs_permission"
pattern = 'Tab\s+to\s+amend.*ctrl\+e\s+to\s+explain'
last_lines = 4

[[rules]]
name = "tool-permission-generic"
state = "needs_permission"
pattern = 'Do\s+you\s+want\s+to.*?\n\s*❯?\s*1\.\s*Yes'
last_lines = 12

[[rules]]
name = "question"
state = "needs_answer"
pattern = '↑/↓\s+to\s+navigate'
last_lines = 4

[[rules]]
name = "question-multi-step"
state = "needs_answer"
pattern = '☐[^\n]*✔\s*Submit'
last_lines = 40

[[rules]]
name = "mcp-server-trust"
state = "needs_trust"
# Anchored (\A): an unanchored lookahead is tried at every position of the screen, each scanning to its end.
# The dialog's last line is its footer (a quote of these words sits above the input box instead).
pattern = '\A(?=.*MCP\s+server).*Enter\s+to\s+confirm[^\n]*\Z'
last_lines = 40

[[rules]]
name = "workspace-trust"
state = "needs_trust"
pattern = '\A(?=.*trust\s+this\s+folder).*Enter\s+to\s+confirm[^\n]*\Z'
last_lines = 40

[[rules]]
name = "plan-review"
state = "plan_review"
pattern = 'How\s+would\s+you\s+like\s+to\s+proceed\?'
last_lines = 12

[[rules]]
name = "choice-dialog"
state = "needs_answer"
pattern = 'Enter\s+to\s+confirm\s+·\s+Esc\s+to\s+cancel[^\n]*\Z'
last_lines = 3

[[rules]]
name = "api-error"
state = "error"
# Only the error the agent ended its turn on: its own line (●/⏺), then at most the turn's "✻ … done"
# line, right above the input box. An older one, followed by a reply or a prompt, or one quoted in a
# message (❯), is not.
pattern = '(?m)^[ \t]*[●⏺][ \t]+API\s+Error:[^\n]*(?:\n(?![ \t]*[●⏺✻❯>])[^\n]*)*(?:\n[ \t]*✻[^\n]*)?(?:\n[ \t]*)*\Z'
last_lines = 12
above_prompt = true

[[rules]]
# The spinner line above the prompt: "✢ Misting… (22s · ↓ 1.9k tokens)". Once the turn is over it says
# "✻ Worked for 1m 48s", without the "…". At the start of the line (answers are indented) and near the
# bottom: the conversation may quote such a line.
name = "working"
state = "busy"
pattern = '(?m)^[·✢✳✶✻✽*]\s+[^\n]*?…\s+\(\d'
last_lines = 40

[[rules]]
# The hint in the status bar under the prompt, cut short ("esc to inter…") in a narrow pane. Only the
# status bar: an answer that mentions it must not keep the session working.
name = "working-hint"
state = "busy"
pattern = 'esc\s+to\s+inter(?:rupt|…)'
last_lines = 3

[menu]
# The glyph that marks the highlighted choice. Change it if your theme draws something else.
cursor = "❯"

[approve]
# Options are chosen by label, then selected with the arrow keys and confirmed with Enter.
default = ['^Yes\b']

[approve.prefer]
# A broader "Yes, allow ... during this session" grants the same access without asking again.
needs_permission = ['^Yes,\s*allow\b.*\bduring\s+this\s+session', '^Yes\b']
needs_trust = ['^Yes\b']
plan_review = ['^Yes\b']
# Questions are answered by a person: no default choice.
needs_answer = []

[deny]
send = [{ key = "Escape" }]
