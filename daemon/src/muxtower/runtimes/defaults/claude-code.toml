# Claude Code. Hooks (http) are the primary state source; these screen rules are the fallback for
# sessions without hooks (adopted panes) and a cross-check. Rules are tried in order, first match wins.
# Override by copying this file to ~/.config/muxtower/runtimes/claude-code.toml.
name = "claude-code"
binary = "claude"
hooks = "claude-code"
default_state = "idle"
auto_approve_states = ["needs_permission", "needs_trust"]
resume = ["--resume"]
option_values = [
  "--model", "--fallback-model", "--permission-mode", "--settings", "--setting-sources", "--mcp-config",
  "--append-system-prompt", "--append-system-prompt-file", "--system-prompt", "--system-prompt-file",
  "--allowedTools", "--allowed-tools", "--disallowedTools", "--disallowed-tools", "--add-dir", "--agent",
  "--agents", "--remote-control", "--resume", "-r", "--session-id", "--plugin-dir", "--betas", "-n", "--name",
]
# Its name in muxtower is its name in Claude Code too (the prompt box, /resume, claude.ai's Remote Control
# list, which takes it from there): `--name`, unless the arguments give one.
name_args = ["--name", "{name}"]
name_options = ["-n", "--name"]
# Its input box between two rules (older versions: "> " over "? for shortcuts"). While it shows, a dialog
# can only be the panel framed right above it (a tip like "Teach auto mode…"), whatever the conversation
# above quotes.
prompt = '^─{8,}[^\n]*\n❯[^\n]*(?:\n[^─\n][^\n]*)*\n─{8,}|^>[^\n]*\n\s*\?\s+for\s+shortcuts'
panel_rule = '^─{8,}\s*$'

[[rules]]
# A message from another Claude session (its SendMessage, or Remote Control from no app of the owner's)
# held for the owner: delivered or denied by its own two choices, never by a default.
name = "peer-message"
state = "needs_permission"
kind = "peer_message"
# At the bottom: its last choice is the screen's last line (a reply quoting the dialog is none).
last_lines = 40
pattern = 'Another\s+Claude\s+session\s+sent\s+a\s+message:.*Deliver\s+this\s+message\s+to\s+Claude[^\n]*(?:\n[ \t]*)*\Z'
sender = '^[ \t]*Another\s+Claude\s+session\s+sent\s+a\s+message:\s+from\s+([^\n]+?)[ \t]*$'

[[rules]]
name = "tool-permission"
state = "needs_permission"
pattern = 'Tab\s+to\s+amend.*ctrl\+e\s+to\s+explain'
last_lines = 4

[[rules]]
name = "tool-permission-generic"
state = "needs_permission"
pattern = 'Do\s+you\s+want\s+to.*?\n\s*❯?\s*1\.\s*Yes'
last_lines = 12

[[rules]]
# AskUserQuestion: "Enter to select · ↑/↓ to navigate · Esc to cancel". Other menus say "to navigate" too
# (/config, /mcp, a multi-select): those are dialogs (below), not a question.
name = "question"
state = "needs_answer"
pattern = 'Enter\s+to\s+select\b[^\n]*\bto\s+navigate'
last_lines = 4

[[rules]]
name = "question-multi-step"
state = "needs_answer"
pattern = '☐[^\n]*✔\s*Submit'
last_lines = 40

[[rules]]
name = "mcp-server-trust"
state = "needs_trust"
# Anchored (\A): an unanchored lookahead is tried at every position of the screen, each scanning to its end.
# The dialog's last line is its footer (a quote of these words sits above the input box instead).
pattern = '\A(?=.*MCP\s+server).*Enter\s+to\s+confirm[^\n]*\Z'
last_lines = 40

[[rules]]
# The first start in bypass mode asks to accept it: the owner's to answer, as a trust prompt.
name = "bypass-mode-confirm"
state = "needs_trust"
pattern = '\A(?=.*Bypass\s+Permissions\s+mode).*Yes,\s+I\s+accept'
last_lines = 30

[[rules]]
name = "workspace-trust"
state = "needs_trust"
pattern = '\A(?=.*trust\s+this\s+folder).*Enter\s+to\s+confirm[^\n]*\Z'
last_lines = 40

[[rules]]
# The first start, before any input box: the theme, then how to sign in. Both are the owner's to choose
# (needs_answer: never approved for them), each matched by its own last line.
name = "first-start-theme"
state = "needs_answer"
pattern = 'Choose\s+the\s+text\s+style\b.*(?:\(ctrl\+t\s+to\s+(?:dis|en)able\)|Light\s+mode\s+\(ANSI\s+colors\s+only\))[^\n]*\Z'
last_lines = 30

[[rules]]
name = "first-start-login"
state = "needs_answer"
pattern = 'Select\s+login\s+method:(?:[ \t]*\n)+(?:[ \t]*(?:❯[ \t]*)?\d+\.[^\n]*(?:\n|\Z))+\Z'
last_lines = 12

[[rules]]
name = "plan-review"
state = "plan_review"
pattern = 'How\s+would\s+you\s+like\s+to\s+proceed\?'
last_lines = 12

# Any other dialog of Claude Code's (a tip, /config, /model, /resume, "Resume this conversation?"…): the owner's
# to answer, and nothing typed goes into it. Tried after every dialog known by name, and seen only where a
# dialog can be (the screen without its input box, or the panel framed right above the box): what a reply
# quotes above the box is none. It says its title: the first line under its top rule.
[[rules]]
# Its footer, as its last line: a key and what it does ("Enter to confirm · Esc to resume", "↓ to navigate
# · ↑ to switch tabs · Esc to go back", "s to use this session only · Enter to save · Esc to cancel"). Not
# the status bar under the box ("⏵⏵ … (shift+tab to cycle)", "esc to interrupt"), shown with no box.
name = "dialog-footer"
state = "needs_answer"
kind = "dialog"
pattern = '(?m)^(?![^\n]*(?:⏵|shift\+tab|esc\s+to\s+inter))[ \t]*(?:[^\n]*·[ \t]+)?(?:Esc|Enter|Space|Tab|Ctrl\+\S+|[↑↓←→](?:/[↑↓←→])?)[ \t]+to[ \t]+\w[^\n]*(?:\n[ \t]*)*\Z'
last_lines = 3
detail = ['\A[─▔]{8,}[ \t]*\n(?:[ \t]*\n)*[ \t]*([^\n]+)']

[[rules]]
# A list of numbered choices with the cursor on one ("❯ 1. Resume" over "  2. Start a new conversation").
name = "dialog-menu"
state = "needs_answer"
kind = "dialog"
pattern = '(?m)\A(?=.*^[ \t]*❯[ \t]*\d+\.[ \t]+\S)(?=.*^[ \t]+\d+\.[ \t]+\S)'
last_lines = 12
detail = ['\A[─▔]{8,}[ \t]*\n(?:[ \t]*\n)*[ \t]*([^\n]+)']

[[rules]]
# Choices to tick: two checkbox lines ("[ ] …", "[x] …", "◯ …", "◉ …").
name = "dialog-checkboxes"
state = "needs_answer"
kind = "dialog"
pattern = '(?m)^[ \t]*(?:❯[ \t]*)?(?:\[[ xX✔✓]\]|[◯◉☐☒☑])[ \t]+\S[^\n]*\n(?:[^\n]*\n){0,8}?[ \t]*(?:❯[ \t]*)?(?:\[[ xX✔✓]\]|[◯◉☐☒☑])[ \t]+\S'
last_lines = 20
detail = ['\A[─▔]{8,}[ \t]*\n(?:[ \t]*\n)*[ \t]*([^\n]+)']

[[rules]]
name = "api-error"
state = "error"
# Only the error the agent ended its turn on: its own line (●/⏺), then at most the turn's "✻ … done"
# line, right above the input box. An older one, followed by a reply or a prompt, or one quoted in a
# message (❯), is not.
pattern = '(?m)^[ \t]*[●⏺][ \t]+API\s+Error:[^\n]*(?:\n(?![ \t]*[●⏺✻❯>])[^\n]*)*(?:\n[ \t]*✻[^\n]*)?(?:\n[ \t]*)*\Z'
last_lines = 12
above_prompt = true

[[rules]]
# The spinner line above the prompt: "✢ Misting… (22s · ↓ 1.9k tokens)". Once the turn is over it says
# "✻ Worked for 1m 48s", without the "…". At the start of the line (answers are indented) and near the
# bottom: the conversation may quote such a line.
name = "working"
state = "busy"
pattern = '(?m)^[·✢✳✶✻✽*]\s+[^\n]*?…\s+\(\d'
last_lines = 40

[[rules]]
# The hint in the status bar under the prompt, cut short ("esc to inter…") in a narrow pane. Only the
# status bar: an answer that mentions it must not keep the session working.
name = "working-hint"
state = "busy"
pattern = 'esc\s+to\s+inter(?:rupt|…)'
last_lines = 3

[context]
# What a dialog asks about, for whoever approves it away from the screen (when no hook said). Only the
# dialog's own lines are searched, from its top rule (the last one) down; the tool is the call right
# above that rule ("● Bash(…)"), not one before another item of the conversation.
top = '^[─▔]{8,}[ \t]*$'
tool = '^[●⏺][ \t]+([^\n(]{1,80}?)\('
tool_stop = '^[●⏺❯>]'
detail = [
  # A message from another session, held: its body.
  '(?s)Message\s+body\s+\(this\s+is\s+what\s+will\s+be\s+delivered\):[ \t]*\n(.*?)\n[ \t]*❯',
  # A permission dialog: what sits between its title ("Bash command") and "Do you want to proceed?".
  '(?s)\A[^\n]*\n[^\n]*\n(.*?)\n[ \t]*Do\s+you\s+want\s+to',
  # Trusting a folder: which one.
  '(?m)^[ \t]*Accessing\s+workspace:[ \t]*\n[ \t]*([^\n]+)',
  # Any other dialog (an MCP server, bypass mode): its first line under the rule.
  '\A─{8,}[ \t]*\n(?:[ \t]*\n)*[ \t]*([^\n]+)',
]
detail_chars = 500

[suggestion]
# The prompt Claude Code suggests after a turn, drawn faint in its empty input line ("❯ yes, create it"):
# → takes it into the line, Enter sends it. Text typed there is drawn plain, so it is not one.
prompt_line = '^❯[ \t\u00a0]+(\S.*?)[ \t\u00a0]*$'
style = '\x1b\[2m'

[menu]
# The glyph that marks the highlighted choice. Change it if your theme draws something else.
cursor = "❯"

[approve]
# Options are chosen by label, then selected with the arrow keys and confirmed with Enter.
default = ['^Yes\b']

[approve.prefer]
# A broader "Yes, allow ... during this session" grants the same access without asking again.
needs_permission = ['^Yes,\s*allow\b.*\bduring\s+this\s+session', '^Yes\b']
needs_trust = ['^Yes\b']
plan_review = ['^Yes\b']
# Questions are answered by a person: no default choice.
needs_answer = []

[deny]
send = [{ key = "Escape" }]

# Permission modes a session can be started in, least to most permissive (`--permission-mode`). Without
# one, Claude Code's own settings decide (`defaultMode` in ~/.claude/settings.json).
[[permission_modes]]
id = "plan"
label = "Plan first"
args = ["--permission-mode", "plan"]

[[permission_modes]]
id = "default"
label = "Ask before acting"
args = ["--permission-mode", "default"]
usual = true

[[permission_modes]]
id = "acceptEdits"
label = "Accept edits"
args = ["--permission-mode", "acceptEdits"]

[[permission_modes]]
id = "auto"
label = "Auto"
args = ["--permission-mode", "auto"]

[[permission_modes]]
id = "bypassPermissions"
label = "Bypass permissions"
args = ["--permission-mode", "bypassPermissions"]
dangerous = true
